<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Story — Tour Story (TourStory) 1080×1920</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1920px; background: #0C163D;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <img src="../assets/photos/classroom-kitchen-view.webp" alt="" style="position:absolute; top:0; left:0; width:100%; height:1080px; object-fit:cover;">
    <div style="position:absolute; top:760px; left:0; right:0; height:360px; background:linear-gradient(transparent, rgba(12,22,61,0.95));"></div>

    <div style="position:absolute; top:130px; left:0; right:0; display:flex; justify-content:center;">
      <!-- Lockup cream, birdSize 64, wordSize 44 -->
      <div style="display:flex; align-items:center; gap:18px;">
        <img src="../assets/bird-cream.png" alt="Starling" style="height:64px; width:auto; object-fit:contain; display:block;">
        <div style="text-align:left; line-height:1;">
          <div style="font-family:var(--font-display); font-weight:600; font-size:44px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
          <div style="font-family:var(--font-sans); font-weight:400; font-size:10.56px; letter-spacing:0.16em; color:#FFF7EB; margin-top:6.16px;">Montessori School</div>
        </div>
      </div>
    </div>

    <div style="position:absolute; left:0; right:0; bottom:0; padding:0 92px 160px; display:flex; flex-direction:column;">
      <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#66CEE7;">Open house</div>
      <div style="font-weight:300; font-size:108px; line-height:0.98; letter-spacing:-0.03em; color:#FFF7EB; margin-top:22px;">Come meet us.</div>

      <div style="display:flex; gap:30px; margin-top:50px; align-items:center;">
        <div style="background:#FFF7EB; color:#0C163D; border-radius:30px; padding:32px 44px; text-align:center;">
          <div data-slot="weekday" style="font-weight:700; font-size:30px; letter-spacing:0.16em;">THU</div>
          <div data-slot="day" style="font-weight:300; font-size:96px; line-height:0.95;">12</div>
          <div data-slot="month" style="font-size:30px; opacity:0.7;">Jun</div>
        </div>
        <div style="display:flex; flex-direction:column; gap:16px;">
          <div data-slot="time" style="font-size:44px; color:#FFF7EB;">10:00 a.m.</div>
          <div style="font-size:34px; color:rgba(255,247,235,0.8); max-width:480px; line-height:1.4;">Capitol Hill, Washington, D.C.</div>
        </div>
      </div>

      <div style="background:#A9729B; color:#FFF7EB; font-weight:600; font-size:38px; padding:26px 0; border-radius:999px; text-align:center; margin-top:56px;">Link in bio →</div>
    </div>
  </div>
</body>
</html>
