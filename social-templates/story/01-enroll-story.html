<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Story — Enroll Story (EnrollStory) 1080×1920</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1920px; background: #0C163D;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- ArchTop w=420 h=210 SKY, top:0 right:120 opacity .95 -->
    <div style="position:absolute; top:0; right:120px; width:420px; height:210px; background:#66CEE7; border-radius:999px 999px 0 0; opacity:0.95;"></div>
    <!-- Circle d=200 PEARLY, top:760 left:-70 -->
    <div style="position:absolute; top:760px; left:-70px; width:200px; height:200px; background:#A9729B; border-radius:50%;"></div>
    <!-- Quarter d=260 PEARLY corner 0 999px 0 0, bottom:0 right:0 opacity .5 -->
    <div style="position:absolute; bottom:0; right:0; width:260px; height:260px; background:#A9729B; border-radius:0 999px 0 0; opacity:0.5;"></div>

    <div style="position:absolute; inset:0; padding:150px 92px; display:flex; flex-direction:column; justify-content:space-between;">
      <div style="display:flex; justify-content:center;">
        <!-- Lockup cream, birdSize 72, wordSize 48 -->
        <div style="display:flex; align-items:center; gap:18px;">
          <img src="../assets/bird-cream.png" alt="Starling" style="height:72px; width:auto; object-fit:contain; display:block;">
          <div style="text-align:left; line-height:1;">
            <div style="font-family:var(--font-display); font-weight:600; font-size:48px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
            <div style="font-family:var(--font-sans); font-weight:400; font-size:11.52px; letter-spacing:0.16em; color:#FFF7EB; margin-top:6.72px;">Montessori School</div>
          </div>
        </div>
      </div>

      <div>
        <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#D2A8C7;">Primary Classroom · Aug 2026</div>
        <div style="font-weight:300; font-size:132px; line-height:0.98; letter-spacing:-0.03em; color:#FFF7EB; margin-top:26px;">Twelve seats.</div>
        <div style="font-size:40px; line-height:1.5; color:rgba(255,247,235,0.82); margin-top:34px; max-width:760px;">Our inaugural Primary Classroom for ages 3–6 opens this fall on Capitol Hill. Reserving now.</div>
      </div>

      <div style="display:flex; flex-direction:column; align-items:center; gap:34px;">
        <div style="background:#FFF7EB; color:#0C163D; font-weight:600; font-size:38px; padding:26px 52px; border-radius:999px;">Link in bio →</div>
        <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#FFF7EB; opacity:0.7;">@starlingmontessori</div>
      </div>
    </div>
  </div>
</body>
</html>
