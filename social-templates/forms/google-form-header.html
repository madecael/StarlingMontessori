<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling Form Header — Navy Centered 1600×400</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1600px; height: 400px; background: #0C163D;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- ArchTop w=260 h=130 SKY, tucked into top-left corner, opacity .2 -->
    <div style="position:absolute; top:0; left:-60px; width:260px; height:130px; background:#66CEE7; border-radius:999px 999px 0 0; opacity:0.2;"></div>
    <!-- Circle d=140 PEARLY, tucked into bottom-right corner, opacity .18 -->
    <div style="position:absolute; bottom:-70px; right:-40px; width:140px; height:140px; background:#A9729B; border-radius:50%; opacity:0.18;"></div>

    <!-- Centered lockup: bird mark + Starling / Montessori School -->
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
      <div style="display:flex; align-items:center; gap:24px;">
        <img src="../assets/bird-cream.png" alt="Starling" style="height:88px; width:auto; object-fit:contain; display:block;">
        <div style="text-align:left; line-height:1;">
          <div style="font-family:var(--font-display); font-weight:600; font-size:56px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
          <div style="font-family:var(--font-sans); font-weight:400; font-size:13.44px; letter-spacing:0.16em; text-transform:uppercase; color:#FFF7EB; margin-top:8px;">Montessori School</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
