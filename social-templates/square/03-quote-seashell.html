<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Quote Seashell (QuoteSeashell) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #FFF7EB;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <div style="position:absolute; left:96px; right:96px; top:0; bottom:220px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
      <img src="../assets/bird-blue.png" alt="Starling" style="height:88px; width:auto; object-fit:contain; display:block;">
      <div style="width:820px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:64px; line-height:1.26; letter-spacing:-0.01em; color:#0C163D; margin-top:44px;">“Where every child's story is cherished.”</div>
    </div>
    <div style="position:absolute; left:0; right:0; bottom:150px; display:flex; flex-direction:column; align-items:center;">
      <div style="width:64px; height:4px; background:#A9729B; margin-bottom:28px; border-radius:2px;"></div>
      <div style="font-family:var(--font-sans); font-weight:700; font-size:24px; letter-spacing:0.2em; text-transform:uppercase; color:#8B5C7E;">The Starling promise</div>
    </div>
    <div style="position:absolute; bottom:64px; left:0; right:0; display:flex; justify-content:center;">
      <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#0C163D; opacity:0.55;">@starlingmontessori</div>
    </div>
  </div>

</html>
