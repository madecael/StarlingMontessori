<!DOCTYPE html>
<html lang="en">
<head>

<title>Starling IG Square — Tip Montessori (TipMontessori) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>

  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #FFF7EB;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <img src="../assets/photos/spooning.webp" alt="" style="position:absolute; top:0; left:0; width:100%; height:560px; object-fit:cover;">
    <!-- Circle d=120 SKY, top:500 right:110 z2 -->
    <div style="position:absolute; top:500px; right:110px; width:120px; height:120px; background:#66CEE7; border-radius:50%; z-index:2;"></div>

    <div style="position:absolute; left:0; right:0; bottom:0; height:560px; background:#FFF7EB; padding:84px 88px; display:flex; flex-direction:column;">
      <div style="display:flex; align-items:center; gap:20px;">

      <div style="font-weight:300; font-size:66px; line-height:1.06; letter-spacing:-0.02em; color:#0C163D; margin-top:34px;">Let them try it alone.</div>

        <!-- Wordmark cetacean size 36 -->

        </div>
        <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#0C163D; opacity:0.55;">@starlingmontessori</div>
