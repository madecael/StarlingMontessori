<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Enroll Primary (EnrollSolid) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #0C163D;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- ArchTop w=320 h=160 SKY, top:0 right:90 opacity .95 -->
    <div style="position:absolute; top:0; right:90px; width:320px; height:160px; background:#66CEE7; border-radius:999px 999px 0 0; opacity:0.95;"></div>
    <!-- Circle d=150 PEARLY, bottom:150 left:-50 -->
    <div style="position:absolute; bottom:150px; left:-50px; width:150px; height:150px; background:#A9729B; border-radius:50%;"></div>
    <!-- Quarter d=170 PEARLY corner 0 999px 0 0, bottom:0 right:0 opacity .55 -->
    <div style="position:absolute; bottom:0; right:0; width:170px; height:170px; background:#A9729B; border-radius:0 999px 0 0; opacity:0.55;"></div>

    <div style="position:absolute; inset:0; padding:88px; display:flex; flex-direction:column; justify-content:space-between;">
      <!-- Lockup cream/seashell -->
      <div style="display:flex; align-items:center; gap:18px;">
        <img src="../assets/bird-cream.png" alt="Starling" style="height:64px; width:auto; object-fit:contain; display:block;">
        <div style="text-align:left; line-height:1;">
          <div style="font-family:var(--font-display); font-weight:600; font-size:44px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
          <div style="font-family:var(--font-sans); font-weight:400; font-size:10.56px; letter-spacing:0.16em; color:#FFF7EB; margin-top:6.16px;">Montessori School</div>
        </div>
      </div>

      <div>
        <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#D2A8C7;">Primary Classroom · August 2026</div>
        <div style="font-weight:300; font-size:118px; line-height:0.98; letter-spacing:-0.03em; color:#FFF7EB; margin-top:22px;">Twelve seats.</div>
        <div style="font-size:34px; line-height:1.5; color:rgba(255,247,235,0.82); margin-top:30px; max-width:720px;">Our inaugural Primary Classroom for ages 3–6 opens this fall on Capitol Hill. Reserving now.</div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#FFF7EB; opacity:0.7;">@starlingmontessori</div>
        <div style="background:#FFF7EB; color:#0C163D; font-weight:600; font-size:30px; padding:18px 34px; border-radius:999px;">Schedule a tour →</div>
      </div>
    </div>
  </div>
</body>
</html>
