<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Open House Jul 18 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #FFF7EB;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- Quarter d=240 SKY corner 0 0 999px 0, top:0 left:0 opacity .9 -->
    <div style="position:absolute; top:0; left:0; width:240px; height:240px; background:#66CEE7; border-radius:0 0 999px 0; opacity:0.9;"></div>
    <!-- ArchTop w=300 h=150 PEARLY, bottom:0 right:90 opacity .9 -->
    <div style="position:absolute; bottom:0; right:90px; width:300px; height:150px; background:#A9729B; border-radius:999px 999px 0 0; opacity:0.9;"></div>

    <div style="position:absolute; inset:0; padding:92px; display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:flex-end;">
        <!-- Lockup cetacean, birdSize 56, wordSize 38 -->
        <div style="display:flex; align-items:center; gap:18px;">
          <img src="../assets/bird-blue.png" alt="Starling" style="height:56px; width:auto; object-fit:contain; display:block;">
          <div style="text-align:left; line-height:1;">
            <div style="font-family:var(--font-display); font-weight:600; font-size:38px; color:#0C163D; letter-spacing:-0.01em;">Starling</div>
            <div style="font-family:var(--font-sans); font-weight:400; font-size:9.12px; letter-spacing:0.16em; color:#0C163D; margin-top:5.32px;">Montessori School</div>
          </div>
        </div>
      </div>

      <div style="margin-top:70px;">
        <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#8B5C7E;">Open house · Capitol Hill</div>
        <div style="font-weight:300; font-size:92px; line-height:1.0; letter-spacing:-0.03em; color:#0C163D; margin-top:20px;">The door is open.</div>
      </div>

      <div style="display:flex; gap:28px; margin-top:56px;">
        <div style="background:#0C163D; color:#FFF7EB; border-radius:28px; padding:30px 40px; text-align:center;">
          <div data-slot="weekday" style="font-weight:700; font-size:26px; letter-spacing:0.16em;">SAT</div>
          <div data-slot="day" style="font-weight:300; font-size:84px; line-height:0.95;">18</div>
          <div data-slot="month" style="font-size:26px; opacity:0.8;">Jul</div>
        </div>
        <div style="display:flex; flex-direction:column; justify-content:center; gap:14px;">
          <div data-slot="time" style="font-size:36px; color:#0C163D;">9 a.m.&#8211;1 p.m.</div>
          <div style="font-size:32px; color:#4A557A; max-width:460px; line-height:1.4;">201 4th St SE · Washington, D.C. Bring your little one.</div>
        </div>
      </div>

      <div style="margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end;">
        <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#0C163D; opacity:0.55;">@starlingmontessori</div>
        <div style="background:#A9729B; color:#FFF7EB; font-weight:600; font-size:28px; padding:16px 30px; border-radius:999px;">No appointment needed</div>
      </div>
    </div>
  </div>
</body>
</html>
