<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Quote Purple (QuotePurple) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #A9729B;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- Circle d=220, top:-70 right:-60 -->
    <div style="position:absolute; top:-70px; right:-60px; width:220px; height:220px; background:rgba(255,247,235,0.14); border-radius:50%;"></div>
    <!-- ArchTop w=260 h=130, bottom:0 left:80 -->
    <div style="position:absolute; bottom:0; left:80px; width:260px; height:130px; background:rgba(12,22,61,0.18); border-radius:999px 999px 0 0;"></div>

    <div style="position:absolute; left:100px; right:100px; top:0; bottom:280px; display:flex; flex-direction:column; justify-content:center;">
      <div style="width:820px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:78px; line-height:1.22; letter-spacing:-0.01em; color:#FFF7EB;">“Free the child's potential, and you will transform him into the world.”</div>
    </div>
    <div style="position:absolute; left:100px; bottom:190px; font-size:30px; color:rgba(255,247,235,0.85); letter-spacing:0.04em;">— Maria Montessori</div>
    <!-- Wordmark seashell size 40, align right -->
    <div style="position:absolute; bottom:72px; right:88px;">
      <div style="text-align:right; line-height:1;">
        <div style="font-family:var(--font-display); font-weight:600; font-size:40px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
        <div style="font-family:var(--font-sans); font-weight:400; font-size:9.6px; letter-spacing:0.16em; color:#FFF7EB; margin-top:5.6px;">Montessori School</div>
      </div>
    </div>
  </div>
</body>
</html>
