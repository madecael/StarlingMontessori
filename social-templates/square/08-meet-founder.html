<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Meet the Founder (MeetFounder) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #FFF7EB;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <!-- Circle d=180 PEARLY_LIGHT, top:90 left:90 opacity .5 -->
    <div style="position:absolute; top:90px; left:90px; width:180px; height:180px; background:#D2A8C7; border-radius:50%; opacity:0.5;"></div>

    <div style="position:absolute; inset:0; padding:92px; display:flex; flex-direction:column; align-items:center; text-align:center;">
      <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#8B5C7E;">Meet the founder</div>
      <div style="width:420px; height:520px; border-radius:999px 999px 28px 28px; overflow:hidden; margin-top:40px; box-shadow:0 18px 40px rgba(12,22,61,0.18);">
        <img src="../assets/photos/founder-portrait.webp" alt="" style="width:100%; height:100%; object-fit:cover;">
      </div>
      <div style="font-weight:300; font-size:72px; letter-spacing:-0.02em; color:#0C163D; margin-top:40px;">Fabienne Deaton</div>
      <div style="font-size:32px; color:#4A557A; margin-top:8px;">Founder · AMI-trained guide</div>
      <div style="margin-top:36px;">
        <!-- Lockup cetacean, birdSize 48, wordSize 34 -->
        <div style="display:flex; align-items:center; gap:18px;">
          <img src="../assets/bird-blue.png" alt="Starling" style="height:48px; width:auto; object-fit:contain; display:block;">
          <div style="text-align:left; line-height:1;">
            <div style="font-family:var(--font-display); font-weight:600; font-size:34px; color:#0C163D; letter-spacing:-0.01em;">Starling</div>
            <div style="font-family:var(--font-sans); font-weight:400; font-size:8.16px; letter-spacing:0.16em; color:#0C163D; margin-top:4.76px;">Montessori School</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
