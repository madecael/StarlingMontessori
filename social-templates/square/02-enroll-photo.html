<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starling IG Square — Enroll Photo (EnrollPhoto) 1080×1080</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { margin: 0; }
  body { background: #ECE6DB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .artboard {
    width: 1080px; height: 1080px; background: #FFF7EB;
    position: relative; overflow: hidden; font-family: var(--font-sans);
  }
</style>
</head>
<body>
  <div class="artboard">
    <img src="../assets/photos/reading-group.webp" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
    <div style="position:absolute; left:0; right:0; bottom:0; padding:72px; background:linear-gradient(transparent, rgba(12,22,61,0.0) 0%, rgba(12,22,61,0.92) 62%);">
      <div style="font-family:var(--font-sans); font-weight:700; font-size:26px; letter-spacing:0.2em; text-transform:uppercase; color:#66CEE7;">Now enrolling</div>
      <div style="font-weight:300; font-size:96px; line-height:1.0; letter-spacing:-0.03em; color:#FFF7EB; margin-top:18px;">Soaring minds. Freeing potential.</div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:40px;">
        <!-- Lockup cream, birdSize 52, wordSize 36 -->
        <div style="display:flex; align-items:center; gap:18px;">
          <img src="../assets/bird-cream.png" alt="Starling" style="height:52px; width:auto; object-fit:contain; display:block;">
          <div style="text-align:left; line-height:1;">
            <div style="font-family:var(--font-display); font-weight:600; font-size:36px; color:#FFF7EB; letter-spacing:-0.01em;">Starling</div>
            <div style="font-family:var(--font-sans); font-weight:400; font-size:8.64px; letter-spacing:0.16em; color:#FFF7EB; margin-top:5.04px;">Montessori School</div>
          </div>
        </div>
        <div style="font-family:var(--font-sans); font-weight:600; font-size:28px; letter-spacing:0.04em; color:#FFF7EB; opacity:0.85;">@starlingmontessori</div>
      </div>
    </div>
  </div>
</body>
</html>
